# ============================================================================
# TuraIDC 发行源码打包
#
# 触发：
#   - push 版本 tag（v*）：打包并发布到对应 GitHub Release
#   - 手动触发（workflow_dispatch）：打包并上传为构建产物（不建 Release）
#
# 产物：turaidc-<版本>.zip
#   - backend/（完整 Laravel 应用，含 composer install --no-dev 装好的 vendor/；
#     web 文档根 = backend/public，解压即可跑 /install 向导）
#   - 前端三端构建产物 dist/（源码不进包，需要重建时从仓库 clone）
#   - 额外预构建一份占位地址的 dist（APP_URL 等用 example.com），
#     解压即可预览；正式上线前请用真实地址重新 pnpm build 覆盖 dist
#
# 另出 4 个独立站点包（适合分目录/分机器部署）：
#   - turaidc-api-<版本>.zip      = 完整 backend/（站点根 backend/public）
#   - turaidc-www-<版本>.zip      = 官网 dist/ 内容（解压即站点根）
#   - turaidc-console-<版本>.zip  = 控制台 dist/ 内容
#   - turaidc-admin-<版本>.zip    = 管理端 dist/ 内容
#
# 说明：
#   - 仅含 backend/ + 三个前端 dist/ + vendor，已剔除前端源码 / docs / .github /
#     .git / node_modules / .env / 安装锁 / 日志缓存
#   - 已补入运行时目录（storage/*、bootstrap/cache），解压即可跑 /install 向导
#   - 解压后：先 `cd backend && php artisan key:generate`，再 `chmod -R 775
#     storage bootstrap/cache`，然后访问 /install（INSTALL_TOKEN 可选）
# ============================================================================
name: Release Source Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包发行源码 zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, openssl, redis, fileinfo, json, intl, bcmath, gd, zip, curl, ctype, dom, tokenizer, xml, simplexml
          tools: composer:v2

      - name: Composer install（backend，含 vendor）
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile --shamefully-hoist --config.verify-deps-before-run=false

      - name: 预构建前端占位 dist
        run: pnpm run build:frontends
        env:
          CI: "true"
          APP_URL: https://api.example.com
          FRONTEND_URL: https://www.example.com
          CLIENT_CONSOLE_URL: https://console.example.com
          ADMIN_URL: https://admin.example.com
          CLIENT_SESSION_COOKIE_DOMAIN: .example.com

      - name: 打包 zip
        run: |
          set -euo pipefail
          STAGING=/tmp/turaidc-pkg
          rm -rf "$STAGING" && mkdir -p "$STAGING"

          # 仅复制部署必需内容（丢弃前端源码、docs、.github 等）：
          #   - backend/ 完整（Laravel 运行必需；web 文档根是 backend/public）
          #   - 三个前端的 dist/（源码不进包；需重建时从仓库 clone）
          cp -a backend "$STAGING/backend"

          # 补入 composer 生成的 vendor（已装好，未跟踪）
          cp -a backend/vendor "$STAGING/backend/vendor"

          # 补入前端预构建 dist（占位地址，未跟踪）；扁平化：dist 内容直接进前端目录根，
          # 这样解压后站点根 = frontend-x/ 本身，无需再下探一层 dist。
          # 同时带入前端根目录的 .htaccess（Apache SPA 回退用，Nginx 忽略）。
          for d in frontend-admin-v3 frontend-user-v3-www frontend-user-v4-console; do
            if [ -d "$d/dist" ]; then
              mkdir -p "$STAGING/$d"
              cp -a "$d/dist/." "$STAGING/$d/"
              [ -f "$d/.htaccess" ] && cp -a "$d/.htaccess" "$STAGING/$d/.htaccess"
            fi
          done

          # 补入 git 不跟踪的运行时目录（根 .gitignore 忽略了 storage/framework/*、
          # storage/logs/ 等），否则解压后 Laravel 会因缺少 storage/framework/cache|
          # views|sessions、logs、bootstrap/cache 而 500（valid cache path）。
          mkdir -p "$STAGING/backend/storage/app/public"
          mkdir -p "$STAGING/backend/storage/framework/cache/data"
          mkdir -p "$STAGING/backend/storage/framework/sessions"
          mkdir -p "$STAGING/backend/storage/framework/views"
          mkdir -p "$STAGING/backend/storage/framework/testing"
          mkdir -p "$STAGING/backend/storage/logs"
          mkdir -p "$STAGING/backend/bootstrap/cache"

          # 彻底清理不应随包发布的内容
          find "$STAGING" -name '.env' -not -path '*/node_modules/*' -delete || true
          find "$STAGING" -name '.env.*' -not -name '.env.example' -delete || true
          rm -f "$STAGING/backend/storage/app/install.lock" || true
          rm -rf "$STAGING/backend/storage/logs"/* "$STAGING/backend/bootstrap/cache"/* 2>/dev/null || true

          VERSION="${{ github.ref_name }}"
          ZIP="turaidc-${VERSION}.zip"
          (cd "$STAGING" && zip -r "/tmp/$ZIP" . -x '*.git*')
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "## 打包完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物：$ZIP" >> "$GITHUB_STEP_SUMMARY"
          echo "- 大小：$(du -h "/tmp/$ZIP" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包四个独立站点 zip
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          STAGING=/tmp/turaidc-pkg
          cd "$STAGING"
          # API：完整 backend（Laravel 不能只抽 public；部署时站点根 = backend/public）
          (cd "$STAGING" && zip -r "/tmp/turaidc-api-${VERSION}.zip" backend -x '*.git*')
          # 前端：扁平化后 dist 内容已直接在 frontend-x/ 根，打包该目录即解压即站点根
          (cd "$STAGING/frontend-user-v3-www" && zip -r "/tmp/turaidc-www-${VERSION}.zip" . -x '*.git*')
          (cd "$STAGING/frontend-user-v4-console" && zip -r "/tmp/turaidc-console-${VERSION}.zip" . -x '*.git*')
          (cd "$STAGING/frontend-admin-v3" && zip -r "/tmp/turaidc-admin-${VERSION}.zip" . -x '*.git*')
          {
            echo "ZIPS<<EOF"
            echo "/tmp/turaidc-api-${VERSION}.zip"
            echo "/tmp/turaidc-www-${VERSION}.zip"
            echo "/tmp/turaidc-console-${VERSION}.zip"
            echo "/tmp/turaidc-admin-${VERSION}.zip"
            echo "/tmp/${ZIP}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "## 独立站点包" >> "$GITHUB_STEP_SUMMARY"
          echo "- turaidc-api / turaidc-www / turaidc-console / turaidc-admin（各为单一站点部署根）" >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPS }}
          generate_release_notes: true

      - name: 上传构建产物（非 tag）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: turaidc-site-packages
          path: /tmp/turaidc-*.zip
          retention-days: 7
